name: Build OrangeFox Recovery (PFUM10 / fox_16.0)

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'OF_MAINTAINER name'
        required: false
        default: 'F7YM'
      build_type:
        description: 'FOX_BUILD_TYPE (Unofficial / Beta / Stable)'
        required: false
        default: 'Unofficial'
      debug_messages:
        description: 'Enable FOX_BUILD_DEBUG_MESSAGES=1'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Publish artifacts to a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup workspace and protect runner from OOM
        run: |
          df -h
          sudo mkdir -p /work/fox_16.0
          sudo chown -R "$USER:$USER" /work
          for p in $(pgrep -f 'Runner\.(Worker|Listener)' || true); do
            echo -1000 | sudo tee "/proc/$p/oom_score_adj" >/dev/null || true
          done
          free -h

      - name: Install build dependencies and repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick jq libarchive-tools \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python-is-python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev zstd
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false
          git lfs install

      - name: Sync OrangeFox fox_16.0 manifest
        working-directory: /work/fox_16.0
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          (
            while true; do
              sleep 30
              used=$(df -h / | awk 'NR==2 {print $3 "/" $2 " (free " $4 ")"}')
              objs=$(find .repo/projects -name '*.git' 2>/dev/null | wc -l)
              echo "[sync progress $(date +%H:%M:%S)] disk=$used projects=$objs"
            done
          ) &
          MON_PID=$!
          trap 'kill $MON_PID 2>/dev/null || true' EXIT
          for attempt in 1 2; do
            echo "=== repo sync attempt $attempt ==="
            if repo sync -c -j16 --force-sync --no-clone-bundle --no-tags --optimized-fetch; then
              break
            fi
            [ "$attempt" -eq 2 ] && exit 1
            sleep 15
          done
          kill $MON_PID 2>/dev/null || true
          trap - EXIT
          echo "=== Disk usage after sync ==="
          df -h
          echo "=== Removing .repo and unused reference trees to reclaim disk space ==="
          rm -rf .repo device/xiaomi prebuilts/bazel/darwin-x86_64
          find . -maxdepth 5 -name .git -type l -delete
          df -h
          echo "=== Creating 16 GiB swapfile for Android 16 Soong ==="
          sudo fallocate -l 16G /work/swapfile || sudo dd if=/dev/zero of=/work/swapfile bs=1M count=16384
          sudo chmod 600 /work/swapfile
          sudo mkswap /work/swapfile
          sudo swapon /work/swapfile
          sudo sysctl -w vm.swappiness=60 || true
          free -h
          df -h

      - name: Copy PFUM10 device tree and tune Soong GC
        run: |
          mkdir -p /work/fox_16.0/device/oppo/PFUM10
          rsync -a --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/" /work/fox_16.0/device/oppo/PFUM10/
          ls -la /work/fox_16.0/device/oppo/PFUM10/
          sha256sum /work/fox_16.0/device/oppo/PFUM10/prebuilt/Image
          python3 - <<'PYEOF'
          p = "/work/fox_16.0/build/soong/ui/build/soong.go"
          s = open(p).read()
          needle = 'invocationEnv := make(map[string]string)'
          assert needle in s, "invocationEnv not found in soong.go"
          patch = needle + '\n\tinvocationEnv["GOGC"] = "30"\n\tinvocationEnv["GOMEMLIMIT"] = "13GiB"'
          open(p, "w").write(s.replace(needle, patch, 1))
          print("Patched soong.go with GOGC=30, GOMEMLIMIT=13GiB")
          PYEOF

      - name: Build OrangeFox bootimage
        shell: bash
        working-directory: /work/fox_16.0
        env:
          INPUT_MAINTAINER: ${{ github.event.inputs.maintainer }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          INPUT_DEBUG: ${{ github.event.inputs.debug_messages }}
        run: |
          set -o pipefail
          source device/oppo/PFUM10/vendorsetup.sh
          export OF_MAINTAINER="${INPUT_MAINTAINER:-F7YM}"
          export FOX_BUILD_TYPE="${INPUT_BUILD_TYPE:-Unofficial}"
          if [ "$INPUT_DEBUG" = "true" ]; then
            export FOX_BUILD_DEBUG_MESSAGES=1
          fi
          export FOX_BUILD_DEVICE="PFUM10"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export GOGC=30
          export GOMEMLIMIT=13GiB
          export JAVA_TOOL_OPTIONS="-Xmx4g"

          (
            while true; do
              sleep 60
              mem=$(free -h | awk 'NR==2 {print "RAM:" $3 "/" $2} NR==3 {print "Swap:" $3 "/" $2}' | tr '\n' ' ')
              dsk=$(df -h / | awk 'NR==2 {print "Disk:" $3 "/" $2 "(free " $4 ")"}')
              echo "[build monitor $(date +%H:%M:%S)] $mem $dsk"
            done
          ) &
          BMON_PID=$!
          trap 'kill $BMON_PID 2>/dev/null || true' EXIT

          source build/envsetup.sh
          lunch twrp_PFUM10-bp2a-eng
          mka -j"$(nproc)" bootimage 2>&1 | tee /tmp/build.log
          kill $BMON_PID 2>/dev/null || true
          trap - EXIT

      - name: Verify Boot v3 header and ramdisk sanity
        run: |
          python3 - <<'PYEOF'
          import hashlib, os, struct

          out_dir = "/work/fox_16.0/out/target/product/PFUM10"
          boot_img = os.path.join(out_dir, "boot.img")
          kernel_src = "/work/fox_16.0/device/oppo/PFUM10/prebuilt/Image"
          rec_root = os.path.join(out_dir, "recovery", "root")

          with open(boot_img, "rb") as f:
              hdr = f.read(4096)
              magic = hdr[:8]
              ksize, rsize, osv, hsz, _, _, _, _, hver = struct.unpack("<9I", hdr[8:44])
              cmdline = hdr[44:44 + 1536].split(b"\x00", 1)[0].decode("utf-8", errors="replace")
              f.seek(4096)
              kdata = f.read(ksize)

          os_ver_raw = osv >> 11
          os_patch_raw = osv & 0x7ff
          os_ver = f"{(os_ver_raw >> 14) & 0x7f}.{(os_ver_raw >> 7) & 0x7f}.{os_ver_raw & 0x7f}"
          os_patch = f"{2000 + (os_patch_raw >> 4):04d}-{os_patch_raw & 0xf:02d}"
          k_sha = hashlib.sha256(kdata).hexdigest()
          src_sha = hashlib.sha256(open(kernel_src, "rb").read()).hexdigest()

          print(f"boot.img: magic={magic!r}, hver={hver}, hsz={hsz}, ksize={ksize}, rsize={rsize}")
          print(f"boot.img: os_version={os_ver}, os_patch_level={os_patch}, cmdline={cmdline!r}")
          print(f"boot.img: kernel_sha256={k_sha}")

          assert magic == b"ANDROID!", f"Bad magic: {magic!r}"
          assert hver == 3, f"Expected header_version 3, got {hver}"
          assert cmdline == "", f"Expected empty cmdline (no twrpfastboot=1), got {cmdline!r}"
          assert os_ver == "12.0.0", f"Expected os_version 12.0.0, got {os_ver}"
          assert os_patch == "2023-09", f"Expected os_patch_level 2023-09, got {os_patch}"
          assert k_sha == src_sha, f"Kernel SHA mismatch: {k_sha} != {src_sha}"
          assert os.path.isfile(os.path.join(rec_root, "vendor/etc/ueventd.rc")), "Missing /vendor/etc/ueventd.rc"
          assert not os.path.exists(os.path.join(rec_root, "ueventd.qcom.rc")), "Legacy /ueventd.qcom.rc still present"
          import glob
          fox_imgs = glob.glob(os.path.join(out_dir, "OrangeFox-*.img"))
          assert fox_imgs, "Missing OrangeFox-*.img output"
          boot_sha = hashlib.sha256(open(boot_img, "rb").read()).hexdigest()
          for fi in fox_imgs:
              fi_sha = hashlib.sha256(open(fi, "rb").read()).hexdigest()
              assert fi_sha == boot_sha, f"{fi} differs from boot.img"
          print("ALL BOOT HEADER AND RAMDISK SANITY CHECKS PASSED.")
          PYEOF

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          [ -f /tmp/build.log ] && cp /tmp/build.log /tmp/artifacts/build.log
          OUT_DIR="/work/fox_16.0/out/target/product/PFUM10"
          if [ -d "$OUT_DIR" ]; then
            ls -lh "$OUT_DIR" | head -60
            for f in "$OUT_DIR"/boot.img "$OUT_DIR"/OrangeFox-*.zip "$OUT_DIR"/OrangeFox-*.img; do
              [ -f "$f" ] && cp -v "$f" /tmp/artifacts/
            done
          fi
          cd /tmp/artifacts
          sha256sum * > SHA256SUMS.txt || true
          ls -lh /tmp/artifacts
          df -h

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-PFUM10-fox16-${{ github.run_number }}
          path: /tmp/artifacts/*
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fox16-r${{ github.run_number }}
          name: OrangeFox fox_16.0 PFUM10 (Build #${{ github.run_number }})
          files: |
            /tmp/artifacts/boot.img
            /tmp/artifacts/OrangeFox-*.zip
            /tmp/artifacts/OrangeFox-*.img
            /tmp/artifacts/SHA256SUMS.txt
